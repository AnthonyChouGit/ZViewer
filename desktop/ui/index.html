<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src http://127.0.0.1:*; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ZViewer · Windows 控制台</title>
  <link rel="icon" href="app-icon.png" type="image/png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shell.css">
  <script src="theme.js"></script>
  <script src="bridge.js"></script>
  <script src="app.js" defer></script>
  <script src="live.js" defer></script>
</head>
<body>
  <div class="windowbar">
    <img class="app-mark" src="app-icon.png" alt="">
    <span class="windowbrand">ZViewer <span>· Windows 控制台</span></span>
    <div class="windowactions">
      <button data-window="minimize" aria-label="最小化" title="最小化"><span class="icon-glyph">&#xE921;</span></button>
      <button data-window="maximize" aria-label="最大化" title="最大化"><span class="icon-glyph">&#xE922;</span></button>
      <button data-window="close" aria-label="关闭到托盘" title="关闭"><span class="icon-glyph">&#xE8BB;</span></button>
    </div>
  </div>
  <aside class="sidebar">
    <div class="nav-head">
      <button class="nav-toggle" id="nav-toggle" aria-label="折叠导航" aria-expanded="true"><span class="icon-glyph">&#xE700;</span></button>
      <a class="brand" href="#overview" aria-label="ZViewer 首页"><img class="brand-avatar" src="app-icon.png" alt="ZViewer 图标"><div>ZViewer<small>Windows 控制台</small></div></a>
    </div>
    <div class="workspace"><span class="workspace-icon" data-icon="monitor"></span><div>本地工作空间<small>Windows · 运行包管理</small></div><span class="workspace-dot"></span></div>
    <div class="nav-caption">工作空间</div>
    <nav aria-label="主导航">
      <a href="#overview" data-page="overview"><span data-icon="grid"></span><span class="nav-label">服务总览</span></a>
      <a href="#frp" data-page="frp"><span data-icon="network"></span><span class="nav-label">FRP 穿透</span></a>
      <a href="#cert" data-page="cert"><span data-icon="shield"></span><span class="nav-label">证书与域名</span></a>
      <a href="#cli" data-page="cli"><span data-icon="watch"></span><span class="nav-label">高画质代理</span></a>
      <a href="#logs" data-page="logs"><span data-icon="terminal"></span><span class="nav-label">运行日志</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a class="settings-link" href="#settings" data-page="settings"><span data-icon="settings"></span><span class="nav-label">应用设置</span></a>
      <button class="docs-link" id="docs-link"><span data-icon="book"></span><span class="nav-label">使用文档</span><span>↗</span></button>
    </div>
  </aside>
  <div class="main-shell">
    <header class="toolbar">
      <div><span class="breadcrumb">工作空间</span><span class="slash">/</span><span id="crumb">服务总览</span></div>
      <div class="toolbar-right">
        <span class="preview-badge"><i></i>界面原型</span>
        <span class="toolbar-divider"></span>
        <button id="tray-button" class="toolbar-button"><span data-icon="tray"></span><span id="tray-label">托盘预览</span></button>
        <button id="theme-button" class="toolbar-button icon-only" aria-label="切换主题" title="主题：跟随系统"><span class="icon-glyph">&#xE706;</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div id="page-view"></div><div id="cli-view" hidden></div></main>
    <footer class="statusbar"><span><i class="status-dot"></i><span id="footer-status">本地界面预览</span></span><span>演示状态<span class="footer-separator">/</span>界面版本 0.1.0</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
</body>
</html>
